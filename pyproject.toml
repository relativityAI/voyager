[project]
name = "voyager"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    # Web / API framework
    "fastapi==0.135.3",
    "uvicorn==0.42.0",
    "gunicorn==25.3.0",
    "pydantic==2.13.4",
    # CLI
    "typer==0.20.0",
    "rich==14.2.0",
    # Data
    "pandas==2.3.3",
    "numpy==2.2.6",
    "pandas-ta==0.4.71b0",
    "yfinance==1.4.1",
    "edgartools==5.56.0",
    # PostgreSQL (async via asyncpg, ORM via SQLAlchemy)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.14.0",
    # HTTP / web scraping
    "requests==2.34.2",
    "curl-cffi==0.15.0",
    "fake-useragent==2.2.0",
    "beautifulsoup4==4.13.5",
    "lxml==5.3.0",
    # PDF text extraction (no OCR)
    "pypdf==6.11.0",
    "pageindex==0.2.15",
    # News + social
    "feedparser==6.0.14",
    "yt-search-python==2.2.1",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.8.19",
    "praw==8.0.3",
    # Multi-provider LLM calls (management sentiment)
    "litellm==1.100.0",
    # Config / logging
    "python-dotenv==1.1.0",
    "loguru==0.7.3",
    # Observability
    "sentry-sdk==2.45.0",
    "prometheus-client==0.21.1",
]

[tool.ruff]
# Target Python version matching your environment
target-version = "py312"

# Exclude common automated directories
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "build",
    "dist",
]

# Match modern line-length standards
line-length = 88

[tool.ruff.lint]
# Select rules to run
# E/W: Pycodestyle errors/warnings
# F: Pyflakes (syntax and bugs)
# I: Isort (clean, sorted import statements)
select = ["E", "W", "F", "I"]

# E203: Ignore rules that conflict with modern code formatting tools
# E501: Ignores long code lines
ignore = ["E203", "E501"]

[tool.ruff.lint.mccabe]
# Flag complex code logic (cyclomatic complexity)
max-complexity = 10

[tool.pytest.ini_options]
# Exclude live (network/proxy) tests by default; run them explicitly with -m live
addopts = "-m 'not live'"
markers = [
    "live: hits a real network endpoint (requires network + working proxy); run explicitly with -m live",
]
asyncio_mode = "strict"
